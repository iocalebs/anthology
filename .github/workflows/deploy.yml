name: Deploy to GitHub Pages

on:
  push:
    branches:
      - trunk

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: typst-community/setup-typst@v5
      - run: sudo apt-get update && sudo apt-get install --yes texlive-lang-japanese
      - run: make artifacts
        env:
          TYPST_FONT_PATHS: /usr/share/texlive/texmf-dist/fonts/opentype/public/haranoaji
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'artifacts/'
      - uses: actions/deploy-pages@v5
